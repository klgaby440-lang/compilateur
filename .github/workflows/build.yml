name: Build SokoMaster EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  # ==========================================
  # JOB 1 : COMPILATION AVEC NUITKA
  # ==========================================
  build-nuitka:
    runs-on: windows-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: 🐍 Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter cryptography httpx nuitka

    - name: 🔨 Compiler avec Nuitka
      run: |
        python -m nuitka --standalone --onefile --windows-console-mode=disable --enable-plugin=tk-inter --company-name="CRYPT" --product-name="SokoMaster" --file-version=1.0.0.0 --product-version=1.0.0.0 --output-dir="dist_nuitka" main.py
        
    - name: 🚀 Uploader l'exécutable Nuitka
      uses: actions/upload-artifact@v4
      with:
        name: SokoMaster-Nuitka-Windows-EXE
        path: dist_nuitka/*.exe

  # ==========================================
  # JOB 2 : COMPILATION AVEC PYOXIDIZER
  # ==========================================
  build-pyoxidizer:
    runs-on: windows-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: 🐍 Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # PyOxidizer offre une excellente stabilité avec Python 3.11/3.12

    - name: 🦀 Installer la chaîne d'outils Rust
      uses: dtolnay/rust-toolchain@stable

    - name: 📦 Installer les dépendances et PyOxidizer
      run: |
        python -m pip install --upgrade pip
        pip install pyoxidizer customtkinter cryptography httpx

    - name: 🛠️ Générer la configuration PyOxidizer (si absente)
      run: |
        if (!(Test-Path "pyoxidizer.bzl")) {
          pyoxidizer init-config-file
        }
      shell: powershell

    - name: 🔨 Compiler avec PyOxidizer
      run: |
        pyoxidizer build --release

    - name: 🚀 Uploader l'exécutable PyOxidizer
      uses: actions/upload-artifact@v4
      with:
        name: SokoMaster-PyOxidizer-Windows-EXE
        path: build/**/release/exe/*.exe
