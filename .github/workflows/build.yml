name: Benchmark de Compilation - PyOxidizer vs Cython ⚡

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer le test manuellement depuis GitHub

jobs:
  benchmark-compilation:
    name: Test Parallèle (${{ matrix.techno }})
    runs-on: windows-latest
    
    strategy:
      fail-fast: false # Permet à un job de continuer même si l'autre échoue
      matrix:
        techno: [pyoxidizer, cython]

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🐍 Configuration de l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances du projet
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      # =============================================================
      # BRANCHE A : PyOxidizer (Rust Loader + CPython Embarqué) 🦀
      # =============================================================
      - name: 🛠️ Installation de Rust & PyOxidizer
        if: matrix.techno == 'pyoxidizer'
        run: |
          rustup update stable
          cargo install pyoxidizer

      - name: ⏱️ Construction avec PyOxidizer & Mesure du Temps
        if: matrix.techno == 'pyoxidizer'
        shell: powershell
        run: |
          $buildTime = Measure-Command { pyoxidizer build --release }
          Write-Host "⏱️ Temps de build PyOxidizer : $($buildTime.TotalSeconds) secondes"
          
          # Recherche du binaire généré
          $exe = Get-ChildItem -Path build/ -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($exe) {
              $sizeMB = [math]::Round($exe.Length / 1MB, 2)
              Write-Host "📏 Taille de l'exécutable binaire : $sizeMB MB"
              
              # Test de vitesse de démarrage
              $runTime = Measure-Command { Start-Process -FilePath $exe.FullName -ArgumentList "--benchmark" -Wait -NoNewWindow }
              Write-Host "⚡ Temps de démarrage exécutable : $($runTime.TotalMilliseconds) ms"
          } else {
              Write-Host "❌ Erreur : Exécutable introuvable."
          }

      # =============================================================
      # BRANCHE B : Compilation Cython Ciblée (.pyd) ⚡
      # =============================================================
      - name: 🛠️ Preparation du Compilateur C & Cython
        if: matrix.techno == 'cython'
        run: |
          pip install cython setuptools

      - name: ⏱️ Compilation des modules C cibles (.pyd) & Mesure
        if: matrix.techno == 'cython'
        shell: powershell
        run: |
          $buildTime = Measure-Command { python setup_cython.py build_ext --inplace }
          Write-Host "⏱️ Temps de compilation Cython : $($buildTime.TotalSeconds) secondes"
          
          # Vérification des fichiers .pyd générés
          $pydFiles = Get-ChildItem -Filter "*.pyd"
          foreach ($file in $pydFiles) {
              $sizeKB = [math]::Round($file.Length / 1KB, 2)
              Write-Host "📦 Module compilé natif : $($file.Name) - Taille : $sizeKB KB"
          }
          
          # Test d'importation et de vitesse d'exécution
          $runTime = Measure-Command { python -c "import securite; import base_donnees; print('Importation native réussie !')" }
          Write-Host "⚡ Temps d'importation des modules C (.pyd) : $($runTime.TotalMilliseconds) ms"
