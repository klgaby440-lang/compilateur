name: Build SokoMaster EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: 🐍 Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Nuitka fonctionne mieux avec la 3.12 sous MSVC

    - name: 📦 Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter cryptography matplotlib httpx nuitka

    - name: 🔨 Compiler avec Nuitka
      run: |
        python -m nuitka --mode=onefile --windows-console-mode=disable --enable-plugin=tk-inter --company-name="CRYPT" --product-name="SokoMaster" --output-dir="dist" main.py

    - name: 🚀 Uploader l'exécutable
      uses: actions/upload-artifact@v4
      with:
        name: SokoMaster-Windows-EXE
        path: dist/*.exe
